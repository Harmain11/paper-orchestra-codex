name: Plugin checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate Python syntax
        run: python -m compileall -q plugins/paper-orchestra-codex/scripts
      - name: Check interactive documentation JavaScript
        run: python tests/check_docs_js.py
      - name: Run tests (no network or API keys)
        run: python -m unittest discover -s tests -v
