<text x="72" y="163" font-size="52" fill="#f7f7f4" font-weight="750">PaperOrchestra</text>
<text x="75" y="208" font-size="25" fill="#d7e3ed">for Codex</text>
<text x="75" y="256" font-size="18" fill="#9ab6c6">Evidence-first research writing. Human-verified science.</text>
