<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="330" viewBox="0 0 1280 330" role="img" aria-labelledby="title desc">
<title id="title">PaperOrchestra for Codex</title>
<desc id="desc">A graphic of research evidence moving through coordinated agents into a manuscript, in ink blue, seafoam and gold.</desc>
